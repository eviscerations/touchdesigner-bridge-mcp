[package]
name = "touchdesigner-bridge-mcp"
version = "0.1.0"
edition = "2021"
description = "AI-driven, data-only TouchDesigner scene construction for projection-mapping content, over MCP — security-first."
license = "PolyForm-Noncommercial-1.0.0"
publish = false   # PolyForm-NC is not an OSI/crates.io license; never publish to a public registry

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"                    # OS per-user dirs — the tool NEVER hardcodes a developer path (except the greenfield default)
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }   # loopback HTTP to the executor
getrandom = "0.2"            # CSPRNG for an optional session token
image = { version = "0.25", default-features = false, features = ["png"] }   # decode+resize oversized renders so they still inline (downscale-to-fit) instead of hard-erroring — driver-seat #1
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }  # RUST_LOG support, logs → stderr + file
tracing-appender = "0.2"     # non-blocking sequential log file in the working directory
# GUI (log toggle, working-dir field, live audit log, arm-bridge helper):
eframe = "0.29"
egui = "0.29"
# MCP stdio server — the sole AI entry point — is hand-rolled JSON-RPC 2.0 over stdin/stdout
# (see `gateway.rs`): no external SDK, full control of the typed security boundary. Uses tokio's
# stdio + serde_json only, already declared above.

[[bin]]
name = "touchdesigner-bridge-mcp"
path = "src/main.rs"

# Embed the Windows .exe icon (the bridge logo) via a resource compiler. Build-only; no-op elsewhere.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
